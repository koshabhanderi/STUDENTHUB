<!DOCTYPE html>
<html>

<head>
    <title>StudentHub - Home</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #e8f5e9;
            margin: 0;
        }

        header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 20px;
        }

        main {
            width: 80%;
            margin: 30px auto;
        }

        section {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
            text-align: center;
        }

        h2 {
            color: #4CAF50;
        }

        p {
            font-size: 18px;
        }

        /* FLEXBOX */
        .menu {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 30px 0;
        }

        .menu a {
            text-decoration: none;
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
        }

        .menu a:hover {
            background-color: #388E3C;
        }

        footer {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 12px;
            margin-top: 30px;
        }

        /* RESPONSIVE */
        @media (max-width: 600px) {
            main {
                width: 90%;
            }

            .menu {
                flex-direction: column;
            }

            .menu a {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>StudentHub</h1>
        <p>Your Student Portal</p>
    </header>

    <main>
        <section>

            <h2>Welcome to StudentHub</h2>

            <p>
                Manage your courses, attendance, fees, events,
                and much more from one place.
            </p>

            <div class="menu">
                <a href="register.html">Register</a>
                <a href="login.html">Login</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
                <a href="events.html">Events</a>
                <a href="faq.html">FAQ</a>
                <a href="feedback.html">Feedback</a>
            </div>

            <p>Select any option above to continue.</p>

        </section>
    </main>

    <footer>
        <p>StudentHub &copy; 2026</p>
    </footer>

</body>

</html>
