<!DOCTYPE html>
<html>

<head>
    <title>About</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
        }

        header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 15px;
        }

        /* FLEXBOX */
        nav {
            background-color: #dddddd;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        nav a {
            text-decoration: none;
            color: black;
            font-weight: bold;
            padding: 8px 15px;
        }

        main {
            width: 70%;
            margin: 20px auto;
        }

        article {
            background-color: white;
            padding: 20px;
            border: 1px solid #cccccc;
        }

        footer {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            main {
                width: 90%;
            }

            nav {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>About StudentHub</h1>
    </header>

    <nav>
        <a href="home.html">Home</a>
    </nav>

    <main>
        <article>
            <h2>About Us</h2>
            <p>StudentHub helps students manage academic information.</p>
        </article>
    </main>

    <footer>
        <p>StudentHub</p>
    </footer>

</body>

</html>
