<!DOCTYPE html>
<html>

<head>
    <title>Profile - StudentHub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #e8f5e9;
            margin: 0;
        }

        header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 20px;
        }

        /* FLEXBOX */
        nav {
            background-color: #dddddd;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 12px;
        }

        nav a {
            text-decoration: none;
            color: black;
            font-weight: bold;
        }

        main {
            width: 70%;
            margin: 30px auto;
        }

        .profile-container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        .profile-heading {
            text-align: center;
            color: #4CAF50;
            margin-bottom: 25px;
        }

        /* GRID */
        .profile-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 15px;
        }

        .profile-label {
            font-weight: bold;
            padding: 12px;
            background-color: #e8f5e9;
        }

        .profile-value {
            padding: 12px;
            border: 1px solid #dddddd;
        }

        /* FLEXBOX */
        .profile-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .profile-buttons a {
            text-decoration: none;
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
        }

        .profile-buttons a:hover {
            background-color: #388E3C;
        }

        footer {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 12px;
            margin-top: 30px;
        }

        @media (max-width: 600px) {

            main {
                width: 90%;
            }

            .profile-grid {
                grid-template-columns: 1fr;
            }

            nav {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Student Profile</h1>
    </header>

    <nav>
        <a href="home.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="events.html">Events</a>
        <a href="contact.html">Contact</a>
        <a href="faq.html">FAQ</a>
    </nav>

    <main>

        <div class="profile-container">

            <h2 class="profile-heading">
                My Profile
            </h2>

            <div class="profile-grid">

                <div class="profile-label">Name</div>
                <div class="profile-value">Student Name</div>

                <div class="profile-label">Username</div>
                <div class="profile-value">student123</div>

                <div class="profile-label">Email</div>
                <div class="profile-value">student@example.com</div>

                <div class="profile-label">Course</div>
                <div class="profile-value">Computer Science</div>

                <div class="profile-label">Semester</div>
                <div class="profile-value">Semester 2</div>

                <div class="profile-label">Roll Number</div>
                <div class="profile-value">25DCS009</div>

            </div>

            <div class="profile-buttons">

                <a href="dashboard.html">
                    Dashboard
                </a>

                <a href="home.html">
                    Go Back to Home
                </a>

            </div>

        </div>

    </main>

    <footer>
        <p>StudentHub &copy; 2026</p>
    </footer>

</body>

</html>
