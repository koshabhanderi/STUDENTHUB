<!DOCTYPE html>
<html>

<head>
    <title>Events</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
        }

        header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 15px;
        }

        main {
            width: 70%;
            margin: 20px auto;
        }

        section {
            background-color: white;
            padding: 20px;
            border: 1px solid #cccccc;
        }

        h2 {
            color: #4CAF50;
        }

        /* GRID */
        .events-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .event-card {
            border: 1px solid #cccccc;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            background-color: #f9f9f9;
        }

        .event-card h3 {
            color: #4CAF50;
        }

        /* FLEXBOX */
        .back-link {
            display: flex;
            justify-content: flex-start;
            margin-top: 20px;
        }

        .back-link a {
            text-decoration: none;
            color: blue;
            font-weight: bold;
        }

        footer {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 20px;
        }

        @media (max-width: 700px) {
            main {
                width: 90%;
            }

            .events-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Events</h1>
    </header>

    <main>

        <section>

            <h2>Upcoming Events</h2>

            <div class="events-grid">

                <div class="event-card">
                    <h3>Sports Day</h3>
                    <p>Annual college sports event.</p>
                </div>

                <div class="event-card">
                    <h3>Hackathon</h3>
                    <p>Programming and innovation event.</p>
                </div>

                <div class="event-card">
                    <h3>Seminar</h3>
                    <p>Educational seminar for students.</p>
                </div>

            </div>

            <div class="back-link">
                <a href="home.html">Go Back to Home</a>
            </div>

        </section>

    </main>

    <footer>
        <p>StudentHub</p>
    </footer>

</body>

</html>
