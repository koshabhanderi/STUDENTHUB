<!DOCTYPE html>
<html>

<head>
    <title>Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
        }

        header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 15px;
        }

        main {
            width: 70%;
            margin: 20px auto;
        }

        section {
            background-color: white;
            padding: 20px;
            border: 1px solid #cccccc;
        }

        /* FLEXBOX */
        .navigation {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .navigation a {
            text-decoration: none;
            color: blue;
            font-weight: bold;
        }

        /* GRID */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .dashboard-card {
            border: 1px solid #cccccc;
            padding: 20px;
            background-color: #f9f9f9;
            border-radius: 8px;
        }

        .dashboard-card h3 {
            color: #4CAF50;
        }

        footer {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 20px;
        }

        @media (max-width: 600px) {

            main {
                width: 90%;
            }

            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Dashboard</h1>
    </header>

    <main>

        <section>

            <div class="navigation">
                <a href="events.html">Events</a>
                <a href="contact.html">Contact</a>
                <a href="faq.html">FAQ</a>
                <a href="home.html">Go Back to Home</a>
            </div>

            <h2>Student Dashboard</h2>

            <div class="dashboard-grid">

                <div class="dashboard-card">
                    <h3>Attendance</h3>
                    <p>Attendance Details</p>
                </div>

                <div class="dashboard-card">
                    <h3>Courses</h3>
                    <p>Course Details</p>
                </div>

                <div class="dashboard-card">
                    <h3>Fees</h3>
                    <p>Fee Details</p>
                </div>

                <div class="dashboard-card">
                    <h3>Events</h3>
                    <p>Upcoming Events</p>
                </div>

            </div>

        </section>

    </main>

    <footer>
        <p>StudentHub</p>
    </footer>

</body>

</html>
