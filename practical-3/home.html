<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentHub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>

        <div class="logo">
            StudentHub
        </div>

        <ul class="nav-links">

            <li>
                <a href="courses.html">Courses</a>
            </li>

            <li>
                <a href="about.html">About Us</a>
            </li>

            <li>
                <a href="contact.html">Contact</a>
            </li>

            <li>
                <a href="login.html" class="login-btn">Login</a>
            </li>

            <li>
                <a href="register.html" class="register-btn">Register</a>
            </li>

            <li>
                <button id="theme-toggle" class="theme-toggle">
                    🌙
                </button>
            </li>

        </ul>

    </nav>


    <main>

        <section class="hero">


            <div class="hero-image">

                <img src="image/student.jpg"
                     alt="Student wearing graduation cap">

            </div>


            <div class="hero-content">

                <div class="blue-circle"></div>

                <div class="red-circle"></div>

                <div class="yellow-triangle"></div>


                <h1>
                    STUDENTHUB
                </h1>

                <h2>
                    Your Student Portal
                </h2>

                <p>
                    Explore courses, discover what StudentHub
                    offers, and begin your academic journey
                    with us.
                </p>


                <div class="hero-buttons">

                    <a href="login.html"
                       class="hero-button hero-login">
                        LOGIN
                    </a>

                    <a href="register.html"
                       class="hero-button hero-register">
                        REGISTER
                    </a>

                </div>

            </div>

        </section>

    </main>



    <footer>

        <p>
            StudentHub &copy; 2026
        </p>

    </footer>


</body>

</html>
