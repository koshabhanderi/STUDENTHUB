<!DOCTYPE html>
<html>

<head>
    <title>Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #e8f5e9;
            margin: 0;
        }

        header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 20px;
        }

        main {
            width: 40%;
            margin: 40px auto;
        }

        form {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;

            /* GRID */
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 8px;
        }

        input[type="submit"] {
            width: auto;
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            justify-self: start;
        }

        /* FLEXBOX */
        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .links a {
            text-decoration: none;
            color: blue;
            font-weight: bold;
        }

        footer {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 12px;
            margin-top: 30px;
        }

        @media (max-width: 600px) {
            main {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Login</h1>
    </header>

    <main>

        <form>

            <label>Username</label>
            <input type="text">

            <label>Password</label>
            <input type="password">

            <input type="submit" value="Login">

            <div class="links">
                <span>Don't have an account?</span>
                <a href="register.html">Register</a>
                <a href="home.html">Go Back to Home</a>
            </div>

        </form>

    </main>

    <footer>
        <p>StudentHub &copy; 2026</p>
    </footer>

</body>

</html>
